<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Games</title>
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Games">
<link rel="icon" id="ico"><link rel="apple-touch-icon" id="aico"><link rel="manifest" id="mf">
<style>
:root{--bg:#fdf6ee;--card:#fff;--ink:#222;--mut:#888;--acc:#7c5cff;--ok:#2bb673;--sh:0 3px 0 rgba(0,0,0,.08)}
.dark{--bg:#15141c;--card:#22212c;--ink:#eee;--mut:#999;--sh:0 3px 0 rgba(0,0,0,.4)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);transition:background .3s}
.wrap{max-width:560px;margin:auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:1.6rem;margin:8px 0}.small{border:0;background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:1rem;box-shadow:var(--sh);cursor:pointer}
.prog{margin:8px 0 4px;font-weight:700}.bar{height:12px;background:var(--card);border-radius:8px;overflow:hidden;box-shadow:var(--sh)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff6fb5);transition:width .4s}
#next{width:100%;margin:14px 0 4px;padding:14px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:1.1rem;font-weight:700;box-shadow:0 4px 0 #5a3fd6;cursor:pointer}
#next:active{transform:translateY(2px);box-shadow:0 2px 0 #5a3fd6}
h2{font-size:1rem;color:var(--mut);margin:20px 4px 8px;text-transform:uppercase;letter-spacing:.05em}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;margin:8px 0;box-shadow:var(--sh);border-left:6px solid var(--c)}
.card a{flex:1;display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font-size:1.15rem;font-weight:600;min-height:40px}
.emo{font-size:1.6rem}.card.done a{opacity:.45;text-decoration:line-through}
.tick{width:40px;height:40px;border-radius:50%;border:3px solid var(--mut);background:none;color:#fff;font-size:1.2rem;cursor:pointer;flex:none}
.done .tick{background:var(--ok);border-color:var(--ok)}
.all{text-align:center;font-size:1.2rem;margin:16px 0;display:none}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 6px;font-size:.95rem;color:var(--mut)}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;border:0;border-radius:12px;padding:10px;background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--sh);cursor:pointer;font-size:1rem}
.tabs button.on{background:var(--acc);color:#fff}
.sc{border:0;border-radius:10px;padding:6px 9px;background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer;flex:none;font-size:.9rem;min-width:44px}
.live{font-size:.85rem;color:var(--mut);margin:4px 2px;min-height:1em}
.banner{background:linear-gradient(90deg,var(--acc),#ff6fb5);color:#fff;border-radius:16px;padding:16px;text-align:center;font-weight:800;font-size:1.2rem;box-shadow:var(--sh);margin:10px 0}
.banner small{display:block;font-weight:600;font-size:.85rem;opacity:.9;margin-top:4px}
.box{background:var(--card);border-radius:16px;padding:12px 14px;margin:8px 0;box-shadow:var(--sh)}
.box h3{margin:0 0 6px;font-size:1rem}.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:.95rem}
.row .mut,.mut{color:var(--mut)}.w{font-weight:800}
.chip{display:inline-block;background:var(--bg);border-radius:999px;padding:4px 10px;margin:3px;font-size:.85rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}
.sheet textarea,.sheet input[type=text],.sheet input[type=number]{width:100%;border-radius:10px;border:2px solid var(--mut);background:var(--bg);color:var(--ink);padding:10px;font-size:1rem;margin:6px 0}
.sheet .q{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.sheet .q button,.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--bg);color:var(--ink);font-weight:700;cursor:pointer;font-size:1rem}
.btn.p{background:var(--acc);color:#fff}
#cf{position:fixed;inset:0;pointer-events:none;z-index:10}
</style></head><body>
<div class="wrap">
<header><h1>🎮 Daily Games</h1><div><button class="small" id="dm" title="Dark mode">🌙</button> <button class="small" id="set" title="Settings">⚙️</button> <button class="small" id="reset" title="Reset">↺</button></div></header>
<div class="top"><span id="me"></span><span id="sync"></span></div>
<div class="tabs"><button id="tg" class="on">✅ Games</button><button id="tb">🏆 Leaderboard</button></div>
<div id="vg">
<div class="prog" id="prog"></div><div class="bar"><i id="fill"></i></div>
<div class="live" id="live"></div>
<button id="next"></button>
<div class="all" id="all">🎉 All done for today! See you tomorrow.</div>
<div id="list"></div></div>
<div id="vb" style="display:none"></div>
</div>
<canvas id="cf"></canvas>
<script>
const appLink=u=>(/Android/i.test(navigator.userAgent)&&u.includes("linkedin.com"))?"intent://"+u.replace("https://","")+"#Intent;scheme=https;package=com.linkedin.android;S.browser_fallback_url="+encodeURIComponent(u)+";end":u;
// Firebase config (filled in by setup_firebase.sh). If null the app runs local-only.
const FB_CONFIG={"projectId": "daily-games-ab8b6", "appId": "1:192958691402:web:00b3ac04e665322b86ceb3", "storageBucket": "daily-games-ab8b6.firebasestorage.app", "apiKey": "AIzaSyAodXeSwl4-FhmzHVVSmMpF4OetsOk3fEQ", "authDomain": "daily-games-ab8b6.firebaseapp.com", "messagingSenderId": "192958691402", "projectNumber": "192958691402", "version": "2"};
const ROOM="r7Kq2xV9mPz4Tn8wLc3j";
// kind: time (seconds, lower better) | guess (lower better) | mist (mistakes, lower better)
const G=[
["LinkedIn games","#0a66c2",[["Wend","https://www.linkedin.com/games/wend/","🌀","wend","time"],["Zip","https://www.linkedin.com/games/zip/","⚡","zip","time"],["Patches","https://www.linkedin.com/games/patches/","🧩","patches","time"],["Sudoku","https://www.linkedin.com/games/mini-sudoku/","🔢","sudoku","time"],["Tango","https://www.linkedin.com/games/tango/","🌗","tango","time"],["Queens","https://www.linkedin.com/games/queens/","👑","queens","time"],["Crossclimb","https://www.linkedin.com/games/crossclimb/","🪜","crossclimb","time"],["Pinpoint","https://www.linkedin.com/games/pinpoint/","📍","pinpoint","guess"]]],
["NYT","#b19cd9",[["Connections","https://www.nytimes.com/games/connections","🔗","connections","mist"],["Wordle","https://www.nytimes.com/games/wordle/index.html","🟩","wordle","guess"]]],
["Globle","#2bb673",[["Globle","https://globle-game.com/game","🌍","globle","guess"]]],
["Songless","#ff6fb5",[["Songless","https://lessgames.com/songless","🎵","songless","guess"]]],
["Krillion","#ff9f1c",[["Krillion","https://krillion.io/","🦐","krillion","guess"]]]];
const GAMES=G.flatMap(g=>g[2].map(x=>({n:x[0],u:x[1],e:x[2],id:x[3],k:x[4],c:g[1]})));
const GM=Object.fromEntries(GAMES.map(g=>[g.id,g]));
const pad=n=>String(n).padStart(2,"0");
const dkey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(k,n)=>{const [y,m,d]=k.split("-").map(Number);return dkey(new Date(y,m-1,d+n))};
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const $=id=>document.getElementById(id);

// ---------- parsing ----------
const toSec=t=>{const p=t.split(":").map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]};
function parseScore(gid,txt){
 const t=String(txt||"").trim();if(!t)return null;const k=GM[gid].k;
 if(/^(x|fail(ed)?|dnf|lost)$/i.test(t))return {f:1,raw:t};
 if(gid==="wordle"){const m=t.match(/Wordle\s+[\d,.]+\s+([1-6X])\/6/i);if(m)return m[1].toUpperCase()==="X"?{f:1,raw:t}:{v:+m[1],raw:t}}
 if(gid==="connections"&&/[🟨🟩🟦🟪]/u.test(t)){
  const rows=t.split(/\n/).map(l=>Array.from(l.replace(/\s/g,"")).filter(c=>"🟨🟩🟦🟪".includes(c))).filter(r=>r.length===4);
  const solved=rows.filter(r=>r.every(c=>c===r[0])).length,mist=rows.length-solved;
  return solved<4?{f:1,v:mist,raw:t}:{v:mist,raw:t}}
 if(gid==="globle"){const m=t.match(/=\s*(\d+)/)||t.match(/in\s+(\d+)\s+(tries|guesses|guess|try)/i)||t.match(/(\d+)\s+(tries|guesses)/i);if(m)return {v:+m[1],raw:t}}
 if(gid==="songless"){const m=t.match(/(\d+)\s*\/\s*\d+/)||t.match(/(?:in|attempt)\s+(\d+)/i);if(m)return {v:+m[1],raw:t};
  const sq=Array.from(t).filter(c=>"🟩🟥⬛⬜🟨🟧".includes(c));if(sq.length){const i=sq.indexOf("🟩");return i<0?{f:1,raw:t}:{v:i+1,raw:t}}}
 if(gid==="pinpoint"){const m=t.match(/(\d)\s*\/\s*5/)||t.match(/(\d+)\s*guess/i);if(m)return {v:+m[1],raw:t};
  if(/📌/u.test(t)){const ar=Array.from(t),i=ar.indexOf("📌");return {v:ar.slice(0,i).filter(c=>c==="🤔").length+1,raw:t}}
  if(/🤔/u.test(t)&&!/📌/u.test(t))return {f:1,raw:t}}
 if(k==="time"){const m=t.match(/(\d{1,2}:\d{2}(?::\d{2})?)/);
  const fl=/flawless|no (hints|mistakes|backtracks?)|perfect|✨/iu.test(t)?1:0;
  if(m)return {v:toSec(m[1]),fl,raw:t};const s=t.match(/^(\d+)\s*s?$/i);if(s)return {v:+s[1],fl,raw:t}}
 const n=t.match(/^\d+$/);if(n)return {v:+n[0],raw:t};
 return null}
const fmt=(gid,s)=>{if(!s)return "–";if(s.f)return "❌";const k=GM[gid].k;
 if(k==="time")return Math.floor(s.v/60)+":"+pad(s.v%60)+(s.fl?" ✨":"");
 if(k==="mist")return s.v+" mist.";return s.v+(s.v==1?" guess":" guesses")};
// compare: negative = a better
const cmp=(a,b)=>{if(a.f&&b.f)return 0;if(a.f)return 1;if(b.f)return -1;return a.v-b.v||((b.fl||0)-(a.fl||0))};

// ---------- state ----------
let players=JSON.parse(localStorage.getItem("dgplayers")||"null")||{ross:{name:"Ross",o:0},michaela:{name:"Michaela",o:1}};
let me=localStorage.getItem("dgme");
let days=JSON.parse(localStorage.getItem("dgdays")||"{}");
let db=null,fs=null,online=false;
const saveLocal=()=>{localStorage.setItem("dgdays",JSON.stringify(days));localStorage.setItem("dgplayers",JSON.stringify(players))};
// migrate old URL-keyed ticks
try{const o=JSON.parse(localStorage.getItem("dg")||"null");if(o&&o.done&&me){const k=dkey();const [y,m,d]=(o.day||"").split("-").map(Number);if(o.day&&dkey(new Date(y,m-1,d))===k){GAMES.forEach(g=>{if(o.done[g.u])((days[k]??={})[me]??={done:{},sc:{}}).done[g.id]=1})}localStorage.removeItem("dg")}}catch(e){}
const pd=(k,p)=>(days[k]&&days[k][p])||{done:{},sc:{}};
const plist=()=>Object.entries(players).sort((a,b)=>(a[1].o??0)-(b[1].o??0)).map(([id,p])=>({id,name:p.name}));
const pname=id=>players[id]?players[id].name:"?";

async function write(k,pid,gid,done,sc){
 const day=(days[k]??={}),p=(day[pid]??={done:{},sc:{}});p.done??={};p.sc??={};
 if(done)p.done[gid]=1;else{delete p.done[gid];delete p.sc[gid]}
 if(sc)p.sc[gid]=sc;saveLocal();render();
 if(!db)return;const {doc,setDoc,deleteField}=fs;
 const patch=done?{done:{[gid]:1}}:{done:{[gid]:deleteField()},sc:{[gid]:deleteField()}};
 if(sc)patch.sc={[gid]:sc};
 try{await setDoc(doc(db,"rooms",ROOM,"days",k),{[pid]:patch},{merge:true})}catch(e){console.warn("sync failed",e)}}
async function savePlayers(){saveLocal();render();if(!db)return;const {doc,setDoc}=fs;
 try{await setDoc(doc(db,"rooms",ROOM),{players})}catch(e){console.warn(e)}}

// ---------- scoring ----------
function dayResult(k){const ps=plist(),res={},wins={},doneN={};
 ps.forEach(p=>{wins[p.id]=0;doneN[p.id]=Object.keys(pd(k,p.id).done||{}).filter(g=>GM[g]).length});
 GAMES.forEach(g=>{const e=ps.map(p=>({id:p.id,s:(pd(k,p.id).sc||{})[g.id]})).filter(x=>x.s).sort((a,b)=>cmp(a.s,b.s));
  e.forEach((x,i)=>x.place=i&&cmp(e[i-1].s,x.s)===0?e[i-1].place:i+1);
  if(e.length>1||(e.length===1&&ps.length===1))e.filter(x=>x.place===1&&!x.s.f).forEach(x=>wins[x.id]++);
  res[g.id]=e});
 const ord=ps.map(p=>p.id).sort((a,b)=>wins[b]-wins[a]||doneN[b]-doneN[a]);
 const top=ord[0],act=ord.filter(id=>doneN[id]>0);
 const winners=!top||!act.length||(wins[top]===0&&doneN[top]===0)?[]:ord.filter(id=>wins[id]===wins[top]&&doneN[id]===doneN[top]);
 return {res,wins,doneN,winners}}
function streak(pid,test){let k=dkey(),n=0;if(!test(k))k=addDays(k,-1);while(test(k)){n++;k=addDays(k,-1)}return n}
function stats(pid){const all=k=>GAMES.every(g=>(pd(k,pid).done||{})[g.id]),any=k=>Object.keys(pd(k,pid).done||{}).length>0;
 const per={};GAMES.forEach(g=>per[g.id]=streak(pid,k=>(pd(k,pid).done||{})[g.id]));
 let wonAll=0,week=0;const t=dkey(),wk=addDays(t,-6);
 Object.keys(days).forEach(k=>{if(dayResult(k).winners.includes(pid)){wonAll++;if(k>=wk&&k<=t)week++}});
 const winStreak=streak(pid,k=>dayResult(k).winners.includes(pid));
 return {all:streak(pid,all),any:streak(pid,any),per,wonAll,week,winStreak}}
function badges(pid){const k=dkey(),sc=pd(k,pid).sc||{},b=[],st=stats(pid);
 GAMES.forEach(g=>{const s=sc[g.id];if(s&&s.fl&&!s.f)b.push("✨ Flawless "+g.n)});
 if(sc.wordle&&!sc.wordle.f&&sc.wordle.v<=2)b.push("🎯 Wordle in "+sc.wordle.v);
 if(sc.connections&&!sc.connections.f&&sc.connections.v===0)b.push("🔗 Perfect Connections");
 if(sc.globle&&!sc.globle.f&&sc.globle.v<=3)b.push("🌍 Globle in "+sc.globle.v);
 if(sc.songless&&!sc.songless.f&&sc.songless.v===1)b.push("🎵 Songless first try");
 if(sc.queens&&!sc.queens.f&&sc.queens.v<=30)b.push("👑 Speedy Queens");
 if(st.winStreak>=3)b.push("🔥 "+st.winStreak+"-day winner");
 if(st.all>=7)b.push("📅 7-day finisher");else if(st.all>=3)b.push("📅 "+st.all+"-day finisher");
 if(GAMES.every(g=>(pd(k,pid).done||{})[g.id]))b.push("🏁 All 13 today");
 return b}

// ---------- render ----------
let tab="g",wasAll=null;
function render(){
 if(!me||!players[me]){pickPlayer();return}
 const k=dkey(),my=pd(k,me),L=$("list");L.innerHTML="";
 $("me").textContent="👤 "+pname(me);$("sync").textContent=db?(online?"🟢 live":"🟡 connecting"):"⚪ offline";
 G.forEach(([t,c,gs])=>{const h=document.createElement("h2");h.textContent=t;L.append(h);
  gs.forEach(([n,u,e,id])=>{const done=my.done&&my.done[id],s=my.sc&&my.sc[id],d=document.createElement("div");
   d.className="card"+(done?" done":"");d.style.setProperty("--c",c);
   d.innerHTML=`<a href="${appLink(u)}" target="_blank" rel="noopener"><span class="emo">${e}</span>${n}</a><button class="sc" aria-label="Score ${n}">${s?fmt(id,s):"+ score"}</button><button class="tick" aria-label="Tick ${n}">${done?"✓":""}</button>`;
   d.querySelector("a").onclick=()=>{setTimeout(()=>write(k,me,id,1),50)};
   d.querySelector(".sc").onclick=()=>scoreSheet(id);
   d.querySelector(".tick").onclick=()=>write(k,me,id,!done);L.append(d)})});
 const n=GAMES.filter(g=>my.done&&my.done[g.id]).length;$("prog").textContent=`${n}/${GAMES.length} done`;
 $("fill").style.width=(100*n/GAMES.length)+"%";
 const others=plist().filter(p=>p.id!==me).map(p=>{const c=GAMES.filter(g=>(pd(k,p.id).done||{})[g.id]).length;return c?`${esc(p.name)} finished ${c}${c===GAMES.length?" 🎉":""}`:""}).filter(Boolean);
 $("live").innerHTML=others.length?"👀 "+others.join(" · "):"";
 const nx=GAMES.find(g=>!(my.done&&my.done[g.id])),b=$("next");
 b.style.display=nx?"block":"none";$("all").style.display=nx?"none":"block";
 if(nx){b.textContent=`▶ Next up: ${nx.n}`;b.onclick=()=>{window.open(appLink(nx.u),"_blank","noopener");write(k,me,nx.id,1)}}
 const isAll=!nx;if(wasAll===false&&isAll)confetti();wasAll=isAll;
 $("vg").style.display=tab==="g"?"block":"none";$("vb").style.display=tab==="b"?"block":"none";
 $("tg").classList.toggle("on",tab==="g");$("tb").classList.toggle("on",tab==="b");
 if(tab==="b")board()}
function board(){const k=dkey(),r=dayResult(k),ps=plist(),medal=["🥇","🥈","🥉"];let h="";
 const w=r.winners;
 h+=`<div class="banner">${w.length?(w.length>1?"🤝 Shared lead: ":"👑 Today's winner: ")+w.map(pname).map(esc).join(" & "):"No scores yet today"}<small>${ps.map(p=>`${esc(p.name)} ${r.wins[p.id]} win${r.wins[p.id]==1?"":"s"} · ${r.doneN[p.id]}/13`).join(" &nbsp;|&nbsp; ")}</small></div>`;
 h+=`<h2>Today's games</h2>`;
 GAMES.forEach(g=>{const e=r.res[g.id];h+=`<div class="box"><h3>${g.e} ${g.n}</h3>`+
  (e.length?e.map(x=>`<div class="row ${x.place===1&&!x.s.f?"w":""}"><span>${x.s.f?"·":medal[x.place-1]||x.place+"."} ${esc(pname(x.id))}</span><span>${fmt(g.id,x.s)}</span></div>`).join(""):`<div class="mut">No scores yet</div>`)+
  ps.filter(p=>!e.find(x=>x.id===p.id)).map(p=>`<div class="row mut"><span>⏳ ${esc(p.name)}</span><span>${(pd(k,p.id).done||{})[g.id]?"played, no score":"–"}</span></div>`).join("")+`</div>`});
 h+=`<h2>Streaks & wins</h2>`;
 ps.forEach(p=>{const s=stats(p.id),top=GAMES.filter(g=>s.per[g.id]>1).sort((a,b)=>s.per[b.id]-s.per[a.id]).slice(0,4);
  h+=`<div class="box"><h3>${esc(p.name)}</h3><div class="row"><span>🔥 All-13 streak</span><span>${s.all} day${s.all==1?"":"s"}</span></div><div class="row"><span>📆 Played-something streak</span><span>${s.any}</span></div><div class="row"><span>🏆 Daily wins this week</span><span>${s.week}</span></div><div class="row"><span>🥇 Daily wins all time</span><span>${s.wonAll}</span></div>`+
  (top.length?`<div class="mut" style="margin-top:4px">${top.map(g=>`<span class="chip">${g.e} ${s.per[g.id]}d</span>`).join("")}</div>`:"")+
  `<div style="margin-top:4px">${badges(p.id).map(b=>`<span class="chip">${esc(b)}</span>`).join("")}</div></div>`});
 h+=`<h2>Last 7 days</h2><div class="box">`;
 for(let i=0;i<7;i++){const d=addDays(k,-i),rr=dayResult(d),[y,m,dd]=d.split("-").map(Number),lbl=i?new Date(y,m-1,dd).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}):"Today";
  h+=`<div class="row"><span>${lbl}</span><span class="${rr.winners.length?"w":"mut"}">${rr.winners.length?"👑 "+rr.winners.map(pname).map(esc).join(" & "):"–"}</span></div>`}
 h+=`</div>`;$("vb").innerHTML=h}

// ---------- sheets ----------
function sheet(html){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sheet">${html}</div>`;o.onclick=e=>{if(e.target===o)o.remove()};document.body.append(o);return o}
function scoreSheet(gid){const g=GM[gid],k=g.k,cur=(pd(dkey(),me).sc||{})[gid];
 const quick=k==="time"?"":k==="mist"?[0,1,2,3].map(n=>`<button data-v="${n}">${n} mist.</button>`).join(""):[1,2,3,4,5,6].map(n=>`<button data-v="${n}">${n}</button>`).join("");
 const o=sheet(`<h3>${g.e} ${g.n} score</h3><div class="mut">Paste the share text, or enter it yourself.</div>
 <textarea id="sp" rows="4" placeholder="Paste share text here"></textarea><div id="pv" class="mut"></div>
 <div class="mut">${k==="time"?"Time (m:ss or seconds)":k==="mist"?"Mistakes":"Guesses"}</div>

 sp.oninput=sm.oninput=up;if(fl)fl.onchange=up;

function pickPlayer(){if(document.querySelector(".ov.pick"))return;
 const o=sheet(`<h3>👋 Who are you?</h3><div class="q">${plist().map(p=>`<button data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>
 <div class="mut">New here? Type your name:</div><input type="text" id="nn" placeholder="Your name"><div class="q"><button class="btn p" id="join">Join</button></div>`);
 o.classList.add("pick");o.onclick=null;

 o.querySelector("#join").onclick=()=>{const n=o.querySelector("#nn").value.trim();if(!n)return;
  const ex=plist().find(p=>p.name.toLowerCase()===n.toLowerCase());if(ex)return set(ex.id);
  const id="p"+Math.random().toString(36).slice(2,9);players[id]={name:n.slice(0,24),o:Math.max(0,...Object.values(players).map(p=>p.o??0))+1};savePlayers();set(id)}}
function settings(){const o=sheet(`<h3>⚙️ Players</h3><div id="pl"></div><div class="q"><button class="btn" id="sw">Switch player</button><button class="btn p" id="dn">Done</button></div>`);
 const draw=()=>{o.querySelector("#pl").innerHTML=plist().map(p=>`<div class="row"><input type="text" data-id="${p.id}" value="${esc(p.name)}"><button class="btn" data-rm="${p.id}" title="Remove">🗑️</button></div>`).join("");
  o.querySelectorAll("input[data-id]").forEach(i=>i.onchange=()=>{const v=i.value.trim();if(v){players[i.dataset.id].name=v.slice(0,24);savePlayers()}});
  o.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const id=b.dataset.rm;if(Object.keys(players).length<2)return;
   if(confirm(`Remove ${pname(id)}? Their old scores stay hidden.`)){delete players[id];savePlayers();if(id===me){me=null;localStorage.removeItem("dgme")}draw()}})};draw();
 o.querySelector("#dn").onclick=()=>{o.remove();render()};
 o.querySelector("#sw").onclick=()=>{me=null;localStorage.removeItem("dgme");o.remove();render()}}

// ---------- confetti ----------
function confetti(){const c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:160},()=>({x:c.width/2,y:c.height/3,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,r:Math.random()*6+4,c:`hsl(${Math.random()*360},90%,60%)`,a:Math.random()*6}));
 let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});
  if(++t<150)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

// ---------- firebase ----------
async function connect(){if(!FB_CONFIG)return;
 try{const V="10.14.1",app=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);fs=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const a=app.initializeApp(FB_CONFIG);
  try{db=fs.initializeFirestore(a,{localCache:fs.persistentLocalCache()})}catch(e){db=fs.getFirestore(a)}
  render();
  const {doc,setDoc,onSnapshot,collection,query,where,documentId}=fs;
  onSnapshot(doc(db,"rooms",ROOM),s=>{if(s.exists()&&s.data().players&&Object.keys(s.data().players).length)players=s.data().players;else setDoc(doc(db,"rooms",ROOM),{players});online=true;saveLocal();render()},e=>console.warn(e));
  onSnapshot(query(collection(db,"rooms",ROOM,"days"),where(documentId(),">=",addDays(dkey(),-60))),s=>{
   const known=new Set(s.docs.map(d=>d.id));
   // push local-only days (offline fallback) up once
   s.docs.forEach(d=>{days[d.id]=d.data()});online=true;saveLocal();render();
   window.__fbReady=true},e=>console.warn(e));
 }catch(e){console.warn("Firebase unavailable, using local only",e);db=null;render()}}
window.__dg={parseScore,fmt,dayResult,stats,badges,get db(){return db},get fs(){return fs},ROOM};
